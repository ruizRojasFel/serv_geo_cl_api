<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Geo CL — Swagger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    // URL pública de la API (ej. Render). Vacía = solo documentación, sin "Try it out".
    const API_URL = "https://serv-geo-cl-api.onrender.com";

    fetch("openapi.json")
      .then((response) => response.json())
      .then((spec) => {
        spec.servers = API_URL ? [{ url: API_URL }] : [];
        SwaggerUIBundle({
          spec,
          dom_id: "#swagger-ui",
          supportedSubmitMethods: API_URL ? ["get", "post", "put", "delete"] : [],
        });
      });
  </script>
</body>
</html>
