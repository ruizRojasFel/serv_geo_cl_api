# =====================================================
# CONFIGURACIÓN GENERAL
# =====================================================
spring:
  application:
    name: api-geo-cl

  # Lee DB_NAME, DB_USER y DB_PASSWORD desde .env (mismo archivo que usa
  # Docker Compose). Las variables de entorno tienen prioridad sobre .env.
  config:
    import: optional:file:.env[.properties]

  # ===================================================
  # BASE DE DATOS
  # ===================================================
  # Si la base no existe, DatabaseCreator la crea al arrancar.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_api_geo_cl}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # ===================================================
  # JPA / HIBERNATE
  # ===================================================
  # El esquema lo gestiona Flyway; Hibernate solo valida que coincida.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===================================================
  # MIGRACIONES (esquema + datos iniciales)
  # ===================================================
  # Scripts en src/main/resources/db/migration. Cada uno se aplica una sola
  # vez, por lo que los datos persisten entre reinicios.
  flyway:
    enabled: true
    locations: classpath:db/migration

# =====================================================
# SERVIDOR
# =====================================================
server:
  port: 8080
