# =====================================================
# Docker Compose — Orquesta app + PostgreSQL
# =====================================================
# Un solo comando levanta todo: docker compose up
services:

  # ===================================================
  # Base de datos PostgreSQL
  # ===================================================
  db:
    image: postgres:16-alpine
    container_name: db_api_geo_cl
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Persiste los datos aunque el contenedor se elimine
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===================================================
  # Aplicación Spring Boot
  # ===================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_geo_cl
    ports:
      - "8080:8080"
    environment:
      # Mismas variables que lee application.yaml; solo cambia el host
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        # Espera a que PostgreSQL esté listo antes de iniciar la app
        condition: service_healthy

# Volumen persistente para PostgreSQL
volumes:
  postgres_data: