name: CI/CD — Build, Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn compile -B

      - name: Run tests
        run: mvn test -B

      - name: Generate Jacoco report
        run: mvn jacoco:report -B

      - name: Upload Jacoco report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      # Cobertura en la raíz y Swagger UI en /swagger (openapi.json lo genera OpenApiDocsExportTest)
      - name: Assemble GitHub Pages site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p target/pages/swagger
          cp -r target/site/jacoco/. target/pages/
          cp docs/swagger/index.html target/swagger/openapi.json target/pages/swagger/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/pages

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Build Docker image
        run: docker build -t api-geo-cl .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"